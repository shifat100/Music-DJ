 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#121316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>MusicDJ Android</title>

<!-- Google Font: Roboto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   MATERIAL DESIGN 3 (ANDROID THEME & VARIABLES)
========================================================= */
:root {
    --md-sys-color-primary: #ffb77c;
    --md-sys-color-on-primary: #4d2600;
    --md-sys-color-primary-container: #6e3a00;
    --md-sys-color-on-primary-container: #ffdcbe;
    
    --md-sys-color-surface: #121316;
    --md-sys-color-surface-dim: #0d0e11;
    --md-sys-color-surface-container: #1e1f23;
    --md-sys-color-surface-container-high: #282a2e;
    --md-sys-color-surface-container-highest: #33353a;
    
    --md-sys-color-on-surface: #e2e2e6;
    --md-sys-color-on-surface-variant: #c4c6d0;
    --md-sys-color-outline: #8e9099;
    --md-sys-color-outline-variant: #44474e;
    
    --md-sys-color-secondary-container: #3a3b40;
    --md-sys-color-on-secondary-container: #e2e2e6;

    --track-drums: #ff5252;
    --track-bass: #448aff;
    --track-chords: #69f0ae;
    --track-accents: #ffd740;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--md-sys-color-surface-dim);
    color: var(--md-sys-color-on-surface);
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* =========================================================
   ANDROID APP SHELL
========================================================= */
#android-app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-width: 600px;
    margin: 0 auto;
    background: var(--md-sys-color-surface);
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
}

/* Top App Bar */
.top-app-bar {
    height: calc(56px + var(--safe-top));
    padding-top: var(--safe-top);
    background: var(--md-sys-color-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-left: 8px;
    padding-right: 8px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    z-index: 20;
}

.top-bar-title-group {
    display: flex;
    align-items: center;
    gap: 12px;
    flex: 1;
    overflow: hidden;
}

.top-bar-title {
    font-size: 19px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.15px;
}

.top-bar-subtitle {
    font-size: 12px;
    color: var(--md-sys-color-primary);
    font-family: 'Roboto Mono', monospace;
}

/* Icon Buttons with Ripple Effect */
.icon-btn {
    width: 44px;
    height: 44px;
    border-radius: 22px;
    border: none;
    background: transparent;
    color: var(--md-sys-color-on-surface);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
}

.icon-btn:active {
    background-color: rgba(255, 255, 255, 0.08);
}

.svg-icon {
    width: 24px;
    height: 24px;
    fill: currentColor;
}

/* Screen Content Area */
#main-viewport {
    flex: 1;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
}

/* =========================================================
   COMPOSER / SEQUENCER SCREEN (TOUCH-OPTIMIZED)
========================================================= */
.composer-view {
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
}

/* Song Meta Strip */
.meta-chip-strip {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--md-sys-color-surface-container);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    overflow-x: auto;
}

.assist-chip {
    height: 32px;
    padding: 0 12px;
    border-radius: 8px;
    background: var(--md-sys-color-surface-container-high);
    color: var(--md-sys-color-on-surface);
    font-size: 13px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 1px solid var(--md-sys-color-outline-variant);
    cursor: pointer;
    white-space: nowrap;
}

.assist-chip:active {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
}

/* Sequencer Grid */
.grid-container {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
    background: var(--md-sys-color-surface-dim);
}

/* Sticky Track Header Column */
.tracks-header-col {
    width: 64px;
    min-width: 64px;
    display: flex;
    flex-direction: column;
    background: var(--md-sys-color-surface-container);
    border-right: 1px solid var(--md-sys-color-outline-variant);
    z-index: 5;
}

.track-corner-cell {
    height: 34px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    color: var(--md-sys-color-outline);
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
}

.track-header-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    position: relative;
}

.track-header-card .track-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.track-header-card.track-0 { color: var(--track-drums); }
.track-header-card.track-1 { color: var(--track-bass); }
.track-header-card.track-2 { color: var(--track-chords); }
.track-header-card.track-3 { color: var(--track-accents); }

/* Horizontal Scroll Area for Steps */
.steps-scroll-viewport {
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    display: flex;
    flex-direction: column;
    -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
}

.step-bars-ruler {
    height: 34px;
    min-height: 34px;
    display: flex;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    background: var(--md-sys-color-surface-container);
    width: max-content;
}

.step-ruler-node {
    width: 48px;
    min-width: 48px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Roboto Mono', monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--md-sys-color-outline);
    border-right: 1px solid rgba(255,255,255,0.05);
}

.step-ruler-node.bar-start {
    color: var(--md-sys-color-primary);
    border-left: 1px solid var(--md-sys-color-outline-variant);
    background: rgba(255, 183, 124, 0.05);
}

.step-ruler-node.active-playhead {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
}

.track-step-row {
    flex: 1;
    display: flex;
    border-bottom: 1px solid var(--md-sys-color-outline-variant);
    width: max-content;
}

/* Tap Target Step Button */
.step-cell {
    width: 48px;
    min-width: 48px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-right: 1px solid rgba(255, 255, 255, 0.05);
    background: transparent;
    cursor: pointer;
    position: relative;
    touch-action: manipulation;
}

.step-cell:active {
    background: rgba(255,255,255,0.08);
}

.step-cell.bar-boundary {
    border-left: 1px solid rgba(255, 255, 255, 0.12);
}

/* Sound Pill inside Step */
.sound-pill {
    width: 40px;
    height: 80%;
    max-height: 52px;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    transition: transform 0.1s ease;
}

.sound-pill:active {
    transform: scale(0.92);
}

.track-0 .sound-pill { background: linear-gradient(135deg, #ff5252, #c62828); color: #fff; }
.track-1 .sound-pill { background: linear-gradient(135deg, #448aff, #1565c0); color: #fff; }
.track-2 .sound-pill { background: linear-gradient(135deg, #69f0ae, #00c853); color: #000; }
.track-3 .sound-pill { background: linear-gradient(135deg, #ffd740, #ffab00); color: #000; }

.sound-pill-empty {
    width: 6px;
    height: 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
}

.step-cell.active-playhead {
    background: rgba(255, 255, 255, 0.12);
}
.step-cell.active-playhead .sound-pill {
    outline: 2px solid #ffffff;
    box-shadow: 0 0 12px var(--md-sys-color-primary);
}

/* =========================================================
   ANDROID BOTTOM PLAYBACK / ACTION BAR
========================================================= */
.android-bottom-bar {
    padding: 10px 16px calc(10px + var(--safe-bottom));
    background: var(--md-sys-color-surface-container);
    border-top: 1px solid var(--md-sys-color-outline-variant);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    z-index: 10;
}

.fab-play-btn {
    height: 52px;
    padding: 0 24px;
    border-radius: 26px;
    border: none;
    background: var(--md-sys-color-primary);
    color: var(--md-sys-color-on-primary);
    font-size: 15px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(255, 183, 124, 0.3);
}

.fab-play-btn:active {
    transform: scale(0.96);
    filter: brightness(0.9);
}

.secondary-control-group {
    display: flex;
    align-items: center;
    gap: 6px;
}

.filled-tonal-btn {
    height: 44px;
    padding: 0 14px;
    border-radius: 22px;
    border: none;
    background: var(--md-sys-color-surface-container-highest);
    color: var(--md-sys-color-on-surface);
    font-size: 13px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
}

.filled-tonal-btn:active {
    background: var(--md-sys-color-secondary-container);
}

/* =========================================================
   MATERIAL BOTTOM SHEET (POINT PICKER & DIALOGS)
========================================================= */
.bottom-sheet-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    opacity: 0;
    transition: opacity 0.2s ease;
}

.bottom-sheet-backdrop.show {
    display: flex;
    opacity: 1;
}

.bottom-sheet {
    width: 100%;
    max-height: 85%;
    background: var(--md-sys-color-surface-container-high);
    border-radius: 28px 28px 0 0;
    padding: 12px 16px calc(16px + var(--safe-bottom));
    display: flex;
    flex-direction: column;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
    transform: translateY(100%);
    transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
}

.bottom-sheet-backdrop.show .bottom-sheet {
    transform: translateY(0);
}

.sheet-drag-handle {
    width: 36px;
    height: 4px;
    border-radius: 2px;
    background: var(--md-sys-color-outline);
    margin: 0 auto 12px;
}

.sheet-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
}

.sheet-title {
    font-size: 18px;
    font-weight: 500;
}

/* Category Filter Chips */
.sheet-chip-filter-row {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 8px;
}

.filter-chip {
    height: 32px;
    padding: 0 14px;
    border-radius: 8px;
    background: var(--md-sys-color-surface-container);
    border: 1px solid var(--md-sys-color-outline-variant);
    color: var(--md-sys-color-on-surface-variant);
    font-size: 13px;
    white-space: nowrap;
    cursor: pointer;
    display: flex;
    align-items: center;
}

.filter-chip.active {
    background: var(--md-sys-color-primary-container);
    color: var(--md-sys-color-on-primary-container);
    border-color: var(--md-sys-color-primary);
    font-weight: 500;
}

/* Sound Point Grid List */
.points-touch-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
    gap: 10px;
    padding: 4px 0 16px;
}

.point-card {
    height: 68px;
    border-radius: 12px;
    background: var(--md-sys-color-surface-container);
    border: 1px solid var(--md-sys-color-outline-variant);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    touch-action: manipulation;
}

.point-card:active {
    background: var(--md-sys-color-primary-container);
    border-color: var(--md-sys-color-primary);
}

.point-card.is-selected {
    border: 2px solid var(--md-sys-color-primary);
    background: rgba(255, 183, 124, 0.12);
}

.point-card .pt-num {
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    font-size: 16px;
    color: var(--md-sys-color-primary);
}

.point-card .pt-name {
    font-size: 11px;
    color: var(--md-sys-color-on-surface-variant);
    margin-top: 2px;
}

.point-card.clear-card .pt-num {
    color: #ff5252;
}

/* =========================================================
   TEMPO / SONG INFO / TEMPLATE LISTS / MENUS
========================================================= */
.material-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
}

.material-list-item {
    padding: 14px 16px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--md-sys-color-surface-container);
    margin-bottom: 6px;
    cursor: pointer;
}

.material-list-item:active {
    background: var(--md-sys-color-surface-container-highest);
}

.item-main-text {
    font-size: 15px;
    font-weight: 500;
}

.item-sub-text {
    font-size: 12px;
    color: var(--md-sys-color-on-surface-variant);
    margin-top: 2px;
}

.tempo-slider-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0;
}

.tempo-big-val {
    font-size: 40px;
    font-family: 'Roboto Mono', monospace;
    font-weight: 700;
    color: var(--md-sys-color-primary);
}

.android-slider {
    width: 100%;
    margin: 20px 0;
    accent-color: var(--md-sys-color-primary);
    height: 6px;
}

/* =========================================================
   NOW PLAYING & MASTER AUDIO RENDER SCREEN
========================================================= */
.player-full-view {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 24px 20px calc(20px + var(--safe-bottom));
    background: radial-gradient(circle at 50% 30%, #202227 0%, #121316 100%);
    text-align: center;
}

.player-vinyl-disc {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    margin: 10px auto;
    background: radial-gradient(circle, #222 25%, var(--md-sys-color-primary) 26%, #111 60%, var(--md-sys-color-primary) 61%, #0a0a0a 100%);
    border: 3px solid var(--md-sys-color-primary);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 35px rgba(255, 183, 124, 0.25);
    animation: spinDisc 6s linear infinite paused;
}

.player-vinyl-disc.spinning {
    animation-play-state: running;
}

@keyframes spinDisc {
    100% { transform: rotate(360deg); }
}

.visualizer-canvas {
    width: 100%;
    height: 50px;
    margin: 10px 0;
}

/* =========================================================
   SNACKBAR (TOAST NOTIFICATIONS)
========================================================= */
#snackbar {
    position: absolute;
    bottom: calc(76px + var(--safe-bottom));
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--md-sys-color-surface-container-highest);
    color: var(--md-sys-color-on-surface);
    padding: 12px 20px;
    border-radius: 20px;
    font-size: 14px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    z-index: 200;
    pointer-events: none;
    opacity: 0;
    transition: transform 0.25s cubic-bezier(0.2,0,0,1), opacity 0.25s ease;
    white-space: nowrap;
    border: 1px solid var(--md-sys-color-outline-variant);
}

#snackbar.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}

/* Progress Dialog Modal */
#android-progress-modal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
}

.progress-card {
    width: 80%;
    max-width: 320px;
    background: var(--md-sys-color-surface-container-high);
    border-radius: 24px;
    padding: 24px;
    text-align: center;
}

.linear-progress {
    width: 100%;
    height: 4px;
    background: var(--md-sys-color-surface-container);
    border-radius: 2px;
    overflow: hidden;
    margin: 16px 0 8px;
}

.linear-progress-fill {
    height: 100%;
    width: 0%;
    background: var(--md-sys-color-primary);
    transition: width 0.15s ease;
}
</style>
</head>

<body>

<div id="android-app">

    <!-- Top App Bar -->
    <header class="top-app-bar">
        <div class="top-bar-title-group">
            <button class="icon-btn" id="topNavBackBtn" onclick="handleNavigationBack()" style="display:none;">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <div>
                <div class="top-bar-title" id="appBarTitle">MusicDJ</div>
                <div class="top-bar-subtitle" id="appBarSubtitle">Ready</div>
            </div>
        </div>
        
        <div style="display:flex;gap:4px;">
            <button class="icon-btn" title="Tempo / BPM" onclick="openTempoSheet()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
            </button>
            <button class="icon-btn" title="Options / Menu" onclick="openMenuSheet()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <!-- Main Viewport -->
    <main id="main-viewport">
        <!-- Injected via JavaScript Views -->
    </main>

    <!-- Bottom Playback Transport Bar -->
    <footer class="android-bottom-bar" id="appBottomBar">
        <button class="fab-play-btn" id="mainPlayFab" onclick="togglePlayback()">
            <svg class="svg-icon" id="mainPlayIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <span id="mainPlayText">Play</span>
        </button>

        <div class="secondary-control-group">
            <button class="filled-tonal-btn" onclick="stopPlayback()">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                Stop
            </button>
            <button class="filled-tonal-btn" onclick="appendFourBars()" title="Add 4 Bars">
                <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                +4
            </button>
        </div>
    </footer>

    <!-- Snackbar for Toast Messages -->
    <div id="snackbar">Notification</div>

    <!-- Progress Modal -->
    <div id="android-progress-modal">
        <div class="progress-card">
            <div style="font-size: 17px; font-weight: 500; color: #fff;" id="progressModalTitle">Mastering Track</div>
            <div class="linear-progress">
                <div class="linear-progress-fill" id="progressModalFill"></div>
            </div>
            <div style="font-size: 13px; color: var(--md-sys-color-primary);" id="progressModalPct">0%</div>
        </div>
    </div>

    <!-- Material Bottom Sheet Modal Container -->
    <div class="bottom-sheet-backdrop" id="bottomSheetBackdrop" onclick="closeBottomSheet(event)">
        <div class="bottom-sheet" id="bottomSheetContent" onclick="event.stopPropagation()">
            <!-- Dynamic Content -->
        </div>
    </div>

</div>

<!-- Hidden Native File Pickers -->
<input type="file" id="mdjFileInput" accept=".mdj,application/json" style="display:none;">

<script>
/* =========================================================
   AUDIO & CONFIGURATION

/* =========================================================

function haptic(ms) {

        try { navigator.vibrate(ms || 8); } catch (e) {}
    }
}

/* =========================================================
   AUDIO CONTEXT & SOUND SYNTHESIS FALLBACK
========================================================= */
var audioCtx = null;
var audioBufferCache = {};
var activeSources = [];
var previewSource = null;

function getAudioContext() {
    if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
    }
    if (audioCtx.state === "suspended") {
        audioCtx.resume();
    }
    return audioCtx;
}

// Generate synthesizer fallback audio buffer if sample files are missing
function generateSynthesizedSound(ctx, track, point) {
    var sampleRate = ctx.sampleRate;
    var duration = (60 / BASE_BPM) * 4;
    var buffer = ctx.createBuffer(2, sampleRate * duration, sampleRate);
    var ch0 = buffer.getChannelData(0);
    var ch1 = buffer.getChannelData(1);
    
    var baseFreqs = [55, 110, 220, 440];
    var baseFreq = (baseFreqs[track] || 110) * (1 + (point % 8) * 0.1);

    for (var i = 0; i < buffer.length; i++) {
        var t = i / sampleRate;
        var env = Math.exp(-t * (track === 0 ? 8 : 2));
        var sample = 0;

        if (track === 0) { // Drums
            sample = (Math.sin(2 * Math.PI * (60 / (t * 10 + 1)) * t) + (Math.random() * 2 - 1) * 0.2) * env;
        } else if (track === 1) { // Bass
            sample = (Math.sin(2 * Math.PI * baseFreq * t) + 0.3 * Math.sin(4 * Math.PI * baseFreq * t)) * env;
        } else if (track === 2) { // Chords
            sample = (Math.sin(2 * Math.PI * baseFreq * t) + Math.sin(2 * Math.PI * baseFreq * 1.25 * t) + Math.sin(2 * Math.PI * baseFreq * 1.5 * t)) * 0.33 * env;
        } else { // Accents
            sample = Math.sin(2 * Math.PI * (baseFreq * 2) * t) * Math.sin(2 * Math.PI * 4 * t) * env;
        }
        ch0[i] = sample * 0.6;
        ch1[i] = sample * 0.6;
    }
    return buffer;
}

function loadSoundBuffer(track, point) {
    if (!point || point <= 0) return Promise.resolve(null);
    var key = track + "_" + point;
    if (audioBufferCache[key]) return Promise.resolve(audioBufferCache[key]);

    var ctx = getAudioContext();
    var primaryUrl = "data/" + track + "/" + point + ".ogg";
    var fallbackUrl = "data/" + track + "/" + point + ".mp3";

    return fetch(primaryUrl)
        .then(function(res){ if(!res.ok) throw new Error(); return res.arrayBuffer(); })
        .catch(function(){
            return fetch(fallbackUrl).then(function(res){ if(!res.ok) throw new Error(); return res.arrayBuffer(); });
        })
        .then(function(buf){
            return new Promise(function(resolve, reject){
                ctx.decodeAudioData(buf, function(decoded){
                    audioBufferCache[key] = decoded;
                    resolve(decoded);
                }, reject);
            });
        })
        .catch(function(){
            // Fallback synthesis ensures it always produces vibrant sound on Android!
            var synthBuf = generateSynthesizedSound(ctx, track, point);
            audioBufferCache[key] = synthBuf;
            return synthBuf;
        });
}

function stopPreviewAudio() {
    if (previewSource) {
        try { previewSource.stop(); previewSource.disconnect(); } catch(e){}
        previewSource = null;
    }
}

function previewSound(track, point) {
    stopPreviewAudio();
    if (!point) return;
    var ctx = getAudioContext();
    loadSoundBuffer(track, point).then(function(buf){
        if (!buf) return;
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = state.bpm / BASE_BPM;
        src.connect(ctx.destination);
        src.start(0);
        previewSource = src;
    });
}

function playTrackSound(track, point) {
    if (!point) return;
    var ctx = getAudioContext();
    var key = track + "_" + point;
    var buf = audioBufferCache[key];
    var rate = state.bpm / BASE_BPM;

    if (buf && state.playing) {
        var src = ctx.createBufferSource();
        src.buffer = buf;
        src.playbackRate.value = rate;
        src.connect(ctx.destination);
        src.start(0);
        activeSources.push(src);
    } else {
        loadSoundBuffer(track, point).then(function(b){
            if (b && state.playing) {
                var s = ctx.createBufferSource();
                s.buffer = b;
                s.playbackRate.value = rate;
                s.connect(ctx.destination);
                s.start(0);
                activeSources.push(s);
            }
        });
    }
}

function stopAllLiveSources() {
    stopPreviewAudio();
    for (var i = 0; i < activeSources.length; i++) {
        try { activeSources[i].stop(); activeSources[i].disconnect(); } catch(e){}
    }
    activeSources = [];
}

/* =========================================================
   SEQUENCER PLAYBACK ENGINE
========================================================= */
function getLastOccupiedStep() {
    var max = -1;
    var totalSteps = getStepCount();
    for (var t = 0; t < TRACK_COUNT; t++) {
        for (var s = 0; s < totalSteps; s++) {
            if (state.data[t][s] > 0 && s > max) max = s;
        }
    }
    return max;
}

function togglePlayback() {
    haptic(15);
    getAudioContext();
    if (state.playing) {
        stopPlayback();
    } else {
        startPlayback();
    }
}

function startPlayback() {
    var last = getLastOccupiedStep();
    if (last === -1) {
        showToast("Add some sound points first!");
        return;
    }
    stopAllLiveSources();
    state.playing = true;
    state.currentStep = 0;
    updatePlaybackControlsUI(true);
    sequencerTick();
}

function stopPlayback() {
    haptic(10);
    state.playing = false;
    if (state.timer) {
        clearTimeout(state.timer);
        state.timer = null;
    }
    stopAllLiveSources();
    state.currentStep = 0;
    updatePlaybackControlsUI(false);
    highlightActiveStep(-1);
}

function sequencerTick() {
    if (!state.playing) return;
    var last = getLastOccupiedStep();

    if (last === -1 || state.currentStep > last || state.currentStep >= getStepCount()) {
        stopPlayback();
        return;
    }

    // Play sounds for this step
    for (var t = 0; t < TRACK_COUNT; t++) {
        var pt = state.data[t][state.currentStep];
        if (pt > 0) playTrackSound(t, pt);
    }

    highlightActiveStep(state.currentStep);
    autoScrollToStep(state.currentStep);

    var stepInterval = (60000 / state.bpm) * 4;

    if (state.currentStep >= last) {
        state.timer = setTimeout(function() {
            stopPlayback();
        }, stepInterval);
        return;
    }

    state.currentStep++;
    state.timer = setTimeout(sequencerTick, stepInterval);
}

function updatePlaybackControlsUI(isPlaying) {
    var btnText = document.getElementById("mainPlayText");
    var btnIcon = document.getElementById("mainPlayIcon");
    if (btnText && btnIcon) {
        if (isPlaying) {
            btnText.innerText = "Pause";
            btnIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
        } else {
            btnText.innerText = "Play";
            btnIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }
    }
}

function highlightActiveStep(stepIndex) {
    var rulerNodes = document.querySelectorAll(".step-ruler-node");
    var cells = document.querySelectorAll(".step-cell");
    
    for (var i = 0; i < rulerNodes.length; i++) {
        var s = parseInt(rulerNodes[i].getAttribute("data-step"));
        if (s === stepIndex) rulerNodes[i].classList.add("active-playhead");
        else rulerNodes[i].classList.remove("active-playhead");
    }

    for (var j = 0; j < cells.length; j++) {
        var cs = parseInt(cells[j].getAttribute("data-step"));
        if (cs === stepIndex) cells[j].classList.add("active-playhead");
        else cells[j].classList.remove("active-playhead");
    }
}

function autoScrollToStep(stepIndex) {
    var scrollViewport = document.getElementById("stepsScrollViewport");
    if (!scrollViewport) return;
    var targetCell = document.querySelector('.step-cell[data-step="' + stepIndex + '"]');
    if (targetCell) {
        var viewWidth = scrollViewport.clientWidth;
        var cellLeft = targetCell.offsetLeft;
        var cellWidth = targetCell.offsetWidth;
        if (cellLeft < scrollViewport.scrollLeft || (cellLeft + cellWidth) > (scrollViewport.scrollLeft + viewWidth)) {
            scrollViewport.scrollLeft = cellLeft - (viewWidth / 2) + (cellWidth / 2);
        }
    }
}

function getStepCount() {
    return (state.data && state.data[0]) ? state.data[0].length : INITIAL_STEPS;

function ensureStepCapacity(count) {
    for (var t = 0; t < TRACK_COUNT; t++) {
        if (!state.data[t]) state.data[t] = [];
        while (state.data[t].length < count) {
            state.data[t].push(0);
        }
    }
}

function handleStepTap(track, step) {
    haptic(10);
    state.editingTrack = track;
    state.editingStep = step;
    openPointPickerSheet();

function handleStepLongPress(event, track, step) {
    event.preventDefault();
    haptic(25);
    state.data[track][step] = 0;
    renderComposer();
    showToast("Cleared Bar " + (step + 1));
}

    var currentTrack = state.editingTrack;
    var currentStep = state.editingStep;

    var categories = ["All", "Intro", "Verse", "Chorus", "Break", "Outro"];
    
    var html = 
        '<div class="sheet-drag-handle"></div>' +
        '<div class="sheet-header">' +
            '<div class="sheet-title" style="color:' + TRACK_CONFIG[currentTrack].color + ';">' +

        html += '<div class="filter-chip ' + (isActive ? 'active' : '') + '" onclick="filterSoundCategory(\'' + cat + '\')">' + cat + '</div>';
    }

    html += '</div>' +
            '<div class="points-touch-grid">';

    // Clear Option
    html += 
        '<div class="point-card clear-card ' + (currentValue === 0 ? 'is-selected' : '') + '" onclick="assignSoundPoint(0)">' +
            '<div class="pt-num">✕</div>' +
            '<div class="pt-name">Empty</div>' +
        '</div>';

    for (var i = 1; i < SOUND_POINTS.length; i++) {
        var pt = SOUND_POINTS[i];
        if (state.activeCategoryFilter !== "All" && pt.category !== state.activeCategoryFilter) continue;

        var isSel = (pt.id === currentValue);
        html += 
            '<div class="point-card ' + (isSel ? 'is-selected' : '') + '" onclick="assignSoundPoint(' + pt.id + ')">' +
                '<div class="pt-num">' + pt.id + '</div>' +
                '<div class="pt-name">' + pt.name + '</div>' +
            '</div>';
    }

    html += '</div>';

    setBottomSheetContent(html);
}

function filterSoundCategory(cat) {
    haptic(8);
    state.activeCategoryFilter = cat;
    openPointPickerSheet();
}

function assignSoundPoint(pointId) {
    haptic(15);
    state.data[state.editingTrack][state.editingStep] = pointId;
    if (pointId > 0) {
        previewSound(state.editingTrack, pointId);
    }
    renderComposer();
    closeBottomSheet();
}

            '<button class="icon-btn" onclick="closeBottomSheet()"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>' +
        '</div>' +
        '<div class="material-list">';

    for (var i = 0; i < TEMPLATES.length; i++) {

            '<div class="material-list-item" onclick="loadTemplate(' + i + ')">' +

}

function loadTemplate(index) {
    haptic(20);

    if (!tpl) return;

    state.data = cloneData(tpl.data);
    state.bpm = tpl.bpm;
    state.songName = tpl.name;
    closeBottomSheet();
    renderComposer();
    showToast('Loaded: "' + tpl.name + '"');

function setBottomSheetContent(html) {
    var container = document.getElementById("bottomSheetContent");
    var backdrop = document.getElementById("bottomSheetBackdrop");
    container.innerHTML = html;
    backdrop.classList.add("show");
}

function closeBottomSheet(e) {
    if (e && e.target !== e.currentTarget) return;
    var backdrop = document.getElementById("bottomSheetBackdrop");
    backdrop.classList.remove("show");
    stopPreviewAudio();
}

/* =========================================================
   OFFLINE MASTERING & WAV EXPORT
========================================================= */
function startRenderAndMaster() {
    closeBottomSheet();
    stopPlayback();
    var last = getLastOccupiedStep();
    if (last === -1) {
        showToast("Grid is empty!");
        return;
    }

    showProgressModal("Mastering Audio...", 25);

    var totalSteps = last + 1;
    var duration = totalSteps * ((60 / state.bpm) * 4);
    var sampleRate = 44100;
    var rate = state.bpm / BASE_BPM;

    setTimeout(function(){
        try {
            var OfflineCtxClass = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            var offlineCtx = new OfflineCtxClass(2, Math.ceil(sampleRate * duration), sampleRate);

            for (var s = 0; s < totalSteps; s++) {
                var startTime = s * ((60 / state.bpm) * 4);
                for (var t = 0; t < TRACK_COUNT; t++) {
                    var pt = state.data[t][s];
                    if (pt > 0) {
                        var buf = audioBufferCache[t + "_" + pt] || generateSynthesizedSound(offlineCtx, t, pt);
                        if (buf) {
                            var src = offlineCtx.createBufferSource();
                            src.buffer = buf;
                            src.playbackRate.value = rate;
                            src.connect(offlineCtx.destination);
                            src.start(startTime);
                        }
                    }
                }
            }

            offlineCtx.startRendering().then(function(renderedBuffer){
                hideProgressModal();
                var wavBlob = bufferToWaveBlob(renderedBuffer);
                if (state.renderedAudioUrl) URL.revokeObjectURL(state.renderedAudioUrl);
                state.renderedAudioBlob = wavBlob;
                state.renderedAudioUrl = URL.createObjectURL(wavBlob);
                openPlayerScreen();
            }).catch(function(){
                hideProgressModal();
                showToast("Render failed");
            });

        } catch (e) {
            hideProgressModal();
            showToast("Render error: " + e.message);
        }
    }, 50);
}

function openPlayerScreen() {
    state.screen = "player";
    document.getElementById("topNavBackBtn").style.display = "inline-flex";
    document.getElementById("appBarTitle").innerText = "Now Playing";
    document.getElementById("appBarSubtitle").innerText = state.songName + " • " + state.bpm + " BPM";
    document.getElementById("appBottomBar").style.display = "none";

    var viewport = document.getElementById("main-viewport");

    viewport.innerHTML = 
        '<div class="player-full-view">' +
            '<div>' +
                '<div class="player-vinyl-disc" id="playerVinylDisc">' +
                    '<svg class="svg-icon" style="width:48px;height:48px;fill:var(--md-sys-color-primary);" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/></svg>' +
                '</div>' +
                '<div style="font-size:22px;font-weight:700;margin-top:14px;color:#fff;">' + escapeHTML(state.songName) + '</div>' +
                '<div style="font-size:13px;color:var(--md-sys-color-primary);margin-top:4px;">Master Stereo • ' + state.bpm + ' BPM</div>' +
            '</div>' +

            '<div>' +
                '<div style="display:flex;justify-content:space-between;font-family:\'Roboto Mono\';font-size:12px;color:var(--md-sys-color-outline);">' +
                    '<span id="playerCurrentTime">00:00</span>' +
                    '<span id="playerTotalDuration">00:00</span>' +
                '</div>' +
                '<input type="range" class="android-slider" id="playerProgressBar" min="0" max="100" value="0" oninput="seekRenderedAudio(this.value)">' +
            '</div>' +

            '<div style="display:flex;flex-direction:column;gap:12px;">' +
                '<div style="display:flex;gap:12px;justify-content:center;">' +
                    '<button class="fab-play-btn" style="flex:1;justify-content:center;" onclick="toggleRenderedPlayback()" id="playerPlayToggleBtn">' +
                        '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>' +
                        '<span>Play Master</span>' +
                    '</button>' +
                    '<button class="filled-tonal-btn" style="height:52px;padding:0 20px;" onclick="shareOrDownloadAudio()">' +
                        '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>' +
                        '<span>Export .WAV</span>' +
                    '</button>' +
                '</div>' +
            '</div>' +
        '</div>';

    initPlayerAudio();
}

function initPlayerAudio() {
    if (state.playerAudio) {
        state.playerAudio.pause();
        state.playerAudio = null;
    }
    state.playerAudio = new Audio(state.renderedAudioUrl);

    state.playerAudio.ontimeupdate = function() {
        var cur = document.getElementById("playerCurrentTime");
        var dur = document.getElementById("playerTotalDuration");
        var bar = document.getElementById("playerProgressBar");
        if (cur && state.playerAudio.duration) {
            cur.innerText = formatTime(state.playerAudio.currentTime);
            dur.innerText = formatTime(state.playerAudio.duration);
            bar.value = (state.playerAudio.currentTime / state.playerAudio.duration) * 100;
        }
    };

    state.playerAudio.onended = function() {
        updatePlayerUI(false);
    };

    toggleRenderedPlayback();
}

function toggleRenderedPlayback() {
    haptic(12);
    if (!state.playerAudio) return;
    if (state.playerAudio.paused) {
        state.playerAudio.play();
        updatePlayerUI(true);
    } else {
        state.playerAudio.pause();
        updatePlayerUI(false);
    }
}

function updatePlayerUI(isPlaying) {
    var disc = document.getElementById("playerVinylDisc");
    var btn = document.getElementById("playerPlayToggleBtn");
    if (disc) {
        if (isPlaying) disc.classList.add("spinning");
        else disc.classList.remove("spinning");
    }
    if (btn) {
        if (isPlaying) {
            btn.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg><span>Pause</span>';
        } else {
            btn.innerHTML = '<svg class="svg-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg><span>Play Master</span>';
        }
    }
}

function seekRenderedAudio(pct) {
    if (state.playerAudio && state.playerAudio.duration) {
        state.playerAudio.currentTime = (pct / 100) * state.playerAudio.duration;
    }
}

function shareOrDownloadAudio() {
    haptic(15);
    if (!state.renderedAudioBlob) return;

    var fileName = sanitizeFilename(state.songName) + ".wav";
    var file = new File([state.renderedAudioBlob], fileName, { type: "audio/wav" });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({
            title: state.songName,
            text: "Listen to my track created with MusicDJ for Android!",
            files: [file]
        }).catch(function(){});
    } else {
        var a = document.createElement("a");
        a.href = state.renderedAudioUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        setTimeout(function(){ document.body.removeChild(a); }, 100);
        showToast("Downloaded " + fileName);
    }
}

/* =========================================================
   IMPORT & EXPORT .MDJ FILES
========================================================= */
function exportMDJFile() {
    closeBottomSheet();
    var mdj = {
        name: state.songName,
        bpm: state.bpm,
        format: 1,
        data: state.data
    };
    var blob = new Blob([JSON.stringify(mdj)], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = sanitizeFilename(state.songName) + ".mdj";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    showToast("Exported .mdj file");
}

function openFilePicker() {
    closeBottomSheet();
    var inp = document.getElementById("mdjFileInput");
    inp.value = "";
    inp.click();
}

document.getElementById("mdjFileInput").onchange = function() {
    var file = this.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var song = JSON.parse(e.target.result);
            if (Array.isArray(song.data)) {
                state.data = cloneData(song.data);
                state.bpm = Number(song.bpm) || 80;
                state.songName = song.name || "Imported Song";
                renderComposer();
                showToast("Imported: " + state.songName);
            }
        } catch(err) {
            showToast("Invalid .mdj file");
        }
    };
    reader.readAsText(file);
};

    closeBottomSheet();
    try {
        var obj = { name: state.songName, bpm: state.bpm, data: state.data };
        localStorage.setItem("musicdj_android_save", JSON.stringify(obj));
        showToast('Saved: "' + state.songName + '"');
    } catch(e) {
        showToast("Storage error");
    }
}

function loadSongFromDevice() {
    closeBottomSheet();
    try {
        var raw = localStorage.getItem("musicdj_android_save");
        if (!raw) { showToast("No saved song found"); return; }
        var obj = JSON.parse(raw);
        state.songName = obj.name || "My Song";
        state.bpm = obj.bpm || 80;
        state.data = cloneData(obj.data);
        renderComposer();
        showToast('Loaded: "' + state.songName + '"');
    } catch(e) {
        showToast("Load error");
    }
}

function showToast(msg) {
    var toast = document.getElementById("snackbar");
    toast.innerText = msg;
    toast.classList.add("show");
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(function(){
        toast.classList.remove("show");
    }, 2200);
}

function showProgressModal(title, pct) {
    var modal = document.getElementById("android-progress-modal");
    document.getElementById("progressModalTitle").innerText = title;
    document.getElementById("progressModalFill").style.width = pct + "%";
    document.getElementById("progressModalPct").innerText = pct + "%";
    modal.style.display = "flex";

function hideProgressModal() {
    document.getElementById("android-progress-modal").style.display = "none";
}

function cloneData(d) { return JSON.parse(JSON.stringify(d)); }
function escapeHTML(str) { return String(str||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function sanitizeFilename(name) { return String(name || "song").replace(/[\\\/:*?"<>|]/g, "_"); }
function formatTime(sec) {
    if (isNaN(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

// WAV Encoder for Direct Device Export
function bufferToWaveBlob(abuffer) {
    var numOfChan = abuffer.numberOfChannels;
    var length = abuffer.length * numOfChan * 2 + 44;
    var outBuffer = new ArrayBuffer(length);
    var view = new DataView(outBuffer);
    var channels = [];
    var offset = 0, pos = 0;

    function setUint16(data){ view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data){ view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8); 
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);
    setUint16(1);
    setUint16(numOfChan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for (var i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));
    while (offset < abuffer.length) {
        for (var c = 0; c < numOfChan; c++) {
            var sample = Math.max(-1, Math.min(1, channels[c][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            view.setInt16(pos, sample, true);
            pos += 2;
        }
        offset++;
    }
    return new Blob([outBuffer], { type: "audio/wav" });
}
