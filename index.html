<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MusicDJ</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#ddd;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

button{
    font-family:inherit;
}

.svg-icon{
    display:inline-block;
    width:20px;
    height:20px;
    fill:currentColor;
    vertical-align:middle;
}

/* ================================
   PHONE CONTAINER
================================ */

#phone{
    position:relative;
    width:100vw;
    height:100vh;
    max-width:420px;
    background:#0a0b0c;
    overflow:hidden;
    border-left:1px solid #333;
    border-right:1px solid #333;
}

/* ================================
   HEADER
================================ */

#header{
    height:57px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    background:linear-gradient(#1d1f22,#101113);
    border-bottom:1px solid #363636;
    font-size:22px;
    color:#ddd;
    letter-spacing:0.5px;
}

/* ================================
   CONTENT
================================ */

#content{
    position:absolute;
    top:57px;
    bottom:48px;
    left:0;
    right:0;
    overflow:hidden;
    background:
        linear-gradient(
            90deg,
            rgba(255,255,255,.01),
            rgba(0,0,0,.05)
        );
}

/* ================================
   SOFTKEYS
================================ */

#softkeys{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    background:linear-gradient(#2c2e30,#111214);
    border-top:1px solid #444;
    font-size:19px;
}

#leftSoft,
#rightSoft{
    min-width:80px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
}

#rightSoft{
    justify-content:flex-end;
    text-align:right;
}

/* ================================
   SPLASH
================================ */

.splash{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.splash-logo{
    font-size:42px;
    color:#eee;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    gap:10px;
}

.splash-loader-bar{
    width:80%;
    max-width:240px;
    height:8px;
    background:#16181a;
    border:1px solid #444;
    border-radius:4px;
    overflow:hidden;
    margin-top:60px;
}

.splash-loader-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #ff9b10, #ff5500);
    transition:width 0.1s linear;
}

.splash-sub{
    margin-top:14px;
    font-size:14px;
    color:#ff9b10;
    letter-spacing:0.5px;
}

/* ================================
   MENU & LISTS
================================ */

.menu{
    padding-top:8px;
    height:100%;
    overflow-y:auto;
}

.menu-item{
    min-height:48px;
    display:flex;
    align-items:center;
    padding:8px 17px;
    font-size:21px;
    cursor:pointer;
}

.menu-item.active{
    color:#fff;
    background:linear-gradient(#ff9b10,#d96800);
}

.menu-item .menu-arrow{
    margin-left:auto;
    display:none;
}

.menu-item.active .menu-arrow{
    display:inline-block;
}

/* ================================
   COMPOSER & DYNAMIC GRID
================================ */

.composer{
    height:100%;
    display:flex;
    flex-direction:column;
}

.composer-info{
    height:34px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px;
    border-bottom:1px solid #3d3d3d;
    font-size:13px;
    color:#bbb;
}

#sequencer{
    flex:1;
    padding:4px;
    display:flex;
    gap:4px;
    overflow:hidden;
    min-height:0;
}

.track-labels-col{
    width:44px;
    min-width:44px;
    display:flex;
    flex-direction:column;
    gap:4px;
}

.track-label{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #555;
    background:#16171a;
    color:#ff9b10;
    user-select:none;
    border-radius:3px;
}

.track-label.active-track{
    border-color:#ff9b10;
    background:#251a10;
}

.track-label.step-num-corner{
    height:22px;
    min-height:22px;
    max-height:22px;
    flex:none;
    font-size:11px;
    font-weight:bold;
    color:#666;
    background:#0f1012;
    border:1px solid #333;
}

.steps-scroll-area{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
    overflow-x:auto;
    overflow-y:hidden;
    background:#080808;
    border-radius:3px;
    padding:2px;
    scroll-behavior:auto;
}

.steps-scroll-area::-webkit-scrollbar{
    height:5px;
}
.steps-scroll-area::-webkit-scrollbar-track{
    background:#111;
}
.steps-scroll-area::-webkit-scrollbar-thumb{
    background:#3d3d3d;
    border-radius:3px;
}
.steps-scroll-area::-webkit-scrollbar-thumb:hover{
    background:#ff9b10;
}

.step-numbers-row{
    height:22px;
    min-height:22px;
    max-height:22px;
    flex:none;
    display:flex;
    gap:2px;
    width:max-content;
}

.step-header-num{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    width:38px;
    min-width:38px;
    height:100%;
    border:1px solid #282a2d;
    background:#141618;
    font-size:11px;
    font-weight:bold;
    color:#777;
    border-radius:2px;
    user-select:none;
    cursor:pointer;
}

.step-header-num.cursor{
    color:#ff9b10;
    border-color:#ff9b10;
    background:#251a10;
}

.step-header-num.playing{
    color:#5fc6ff;
    border-color:#5fc6ff;
    background:#092535;
}

.track-steps-row{
    flex:1;
    display:flex;
    gap:2px;
    min-height:0;
    width:max-content;
}

.step{
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    width:38px;
    min-width:38px;
    height:100%;
    border:1px solid #242424;
    background:#101112;
    font-size:12px;
    color:#bbb;
    cursor:pointer;
    border-radius:2px;
    user-select:none;
}

.step.has-value{
    background:linear-gradient(#ff9b12,#df7200);
    color:#fff;
    font-weight:bold;
}

.step.cursor{
    outline:2px solid #ffffff;
    z-index:3;
}

.step.playing{
    box-shadow:inset 0 0 0 2px #5fc6ff, 0 0 8px #00a2ff;
}

/* ================================
   TRANSPORT
================================ */

.transport{
    height:58px;
    display:flex;
    gap:5px;
    padding:5px;
}

.transport button{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid #666;
    background:linear-gradient(#1d1f21,#101112);
    color:#ddd;
    font-size:18px;
    border-radius:4px;
    cursor:pointer;
    outline:none;
    transition:background .15s, border-color .15s, box-shadow .15s, color .15s;
}

.transport button:hover,
.transport button:focus{
    background:linear-gradient(#ff9b10,#d96800);
    border:2px solid #ffffff;
    color:#ffffff;
    box-shadow:0 0 10px rgba(255,155,16,.8);
}

.transport button:active{
    background:#b35300;
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6);
}

/* ================================
   POINT & TEMPLATE LISTS
================================ */

.point-list{
    height:100%;
    overflow-y:auto;
}

.point-category-header{
    background:#1b1d20;
    color:#ff9b10;
    font-size:14px;
    font-weight:bold;
    padding:6px 14px;
    text-transform:uppercase;
    letter-spacing:1px;
    border-top:1px solid #333;
    border-bottom:1px solid #222;
    position:sticky;
    top:0;
    z-index:2;
}

.point-item{
    min-height:40px;
    display:flex;
    align-items:center;
    padding:6px 14px;
    font-size:17px;
    border-bottom:1px solid #1c1d1f;
    cursor:pointer;
}

.point-num{
    display:inline-block;
    width:36px;
    font-weight:bold;
    color:#ff9b10;
}

.point-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.point-item.active{
    background:linear-gradient(#ff9b10,#d96a00);
    color:#fff;
}

.point-item.active .point-num{
    color:#fff;
}

.point-item.empty{
    color:#888;
}

.point-item.empty .point-num{
    color:#888;
}

.template-item{
    min-height:54px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:8px 16px;
    border-bottom:1px solid #1c1d1f;
    cursor:pointer;
}

.template-item.active{
    background:linear-gradient(#ff9b10,#d96a00);
    color:#fff;
}

.template-title{
    font-size:18px;
    font-weight:bold;
}

.template-desc{
    font-size:13px;
    color:#aaa;
    margin-top:2px;
}

.template-item.active .template-desc{
    color:#ffe0b2;
}

/* ================================
   PLAYER SCREEN
================================ */

.player-screen{
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:14px 14px 8px;
    background:radial-gradient(circle at center, #1b1d22 0%, #0a0b0d 100%);
    text-align:center;
}

.player-disc-wrap{
    margin-top:6px;
    position:relative;
    width:105px;
    height:105px;
}

.player-disc{
    width:100%;
    height:100%;
    border-radius:50%;
    background:radial-gradient(circle, #222 25%, #ff9b10 26%, #111 60%, #ff9b10 61%, #050505 100%);
    border:3px solid #ff9b10;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#ff9b10;
    box-shadow:0 0 25px rgba(255,155,16,.4);
    animation:spinDisc 5s linear infinite paused;
}

.player-disc.playing{
    animation-play-state:running;
}

@keyframes spinDisc{
    100%{ transform:rotate(360deg); }
}

.player-title{
    font-size:21px;
    font-weight:bold;
    color:#fff;
    margin-top:10px;
    text-shadow:0 0 8px rgba(255,255,255,.2);
}

.player-sub{
    font-size:13px;
    color:#ff9b10;
    margin-top:3px;
}

.player-equalizer{
    display:flex;
    gap:4px;
    height:18px;
    align-items:flex-end;
    justify-content:center;
    margin-top:6px;
}

.eq-bar{
    width:4px;
    background:#ff9b10;
    height:4px;
    border-radius:2px;
}

.eq-bar.anim{
    animation:eqPulse 0.5s ease-in-out infinite alternate;
}
.eq-bar.b1{ animation-delay:0.1s; }
.eq-bar.b2{ animation-delay:0.3s; }
.eq-bar.b3{ animation-delay:0.2s; }
.eq-bar.b4{ animation-delay:0.4s; }
.eq-bar.b5{ animation-delay:0.15s; }

@keyframes eqPulse{
    0%{ height:4px; }
    100%{ height:18px; }
}

.player-progress-container{
    width:100%;
    margin:6px 0;
}

.player-progress-bar{
    width:100%;
    height:7px;
    background:#222;
    border-radius:4px;
    overflow:hidden;
    border:1px solid #444;
}

.player-progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#ff9b10,#ff5500);
    transition:width .1s linear;
}

.player-time-display{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:#888;
    margin-top:4px;
}

.player-controls-row{
    display:flex;
    gap:8px;
    width:100%;
}

.player-ctrl-btn{
    flex:1;
    padding:9px 0;
    background:#1d1f21;
    border:1px solid #555;
    color:#fff;
    font-size:16px;
    border-radius:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.player-ctrl-btn:active,
.player-ctrl-btn:focus{
    background:#ff9b10;
    color:#000;
}

.player-download-btn{
    width:100%;
    padding:10px;
    background:linear-gradient(#ff9b10,#d96800);
    border:1px solid #fff;
    color:#fff;
    font-size:15px;
    font-weight:bold;
    border-radius:4px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    box-shadow:0 0 10px rgba(255,155,16,.5);
}

/* ================================
   INFO & DIALOGS
================================ */

.info{
    padding:16px;
    font-size:18px;
    line-height:1.5;
}

.info-row{
    margin-bottom:10px;
}

.song-input{
    width:100%;
    padding:10px;
    background:#111;
    color:#fff;
    border:2px solid #ff9b10;
    font-size:18px;
    border-radius:4px;
    outline:none;
}

.song-input:focus{
    background:#1a1a1a;
    box-shadow:0 0 8px rgba(255,155,16,.8);
}

#dialogOverlay,
#progressOverlay{
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;
    z-index:100;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
}

.dialog{
    width:85%;
    background:#17191b;
    border:2px solid #777;
    box-shadow:0 0 20px #000;
    border-radius:4px;
    overflow:hidden;
}

.dialog-title{
    padding:12px;
    text-align:center;
    background:#202225;
    border-bottom:1px solid #555;
    font-size:20px;
    color:#ff9b10;
    font-weight:bold;
}

.dialog-message{
    padding:18px;
    text-align:center;
    font-size:16px;
    line-height:1.5;
}

.modal-progress-bar{
    width:100%;
    height:10px;
    background:#0e0f10;
    border:1px solid #555;
    border-radius:5px;
    overflow:hidden;
    margin:10px 0 4px;
}

.modal-progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, #ff9b10, #ff5500);
    transition:width 0.15s ease-out;
}

.dialog-button{
    width:100%;
    height:44px;
    border:0;
    border-top:1px solid #555;
    background:#242628;
    color:#eee;
    font-size:18px;
    cursor:pointer;
}

.dialog-button:focus,
.dialog-button:hover{
    background:#d96800;
    color:#fff;
}

.help{
    height:100%;
    overflow:auto;
    padding:18px;
}

.help h2{
    margin:0 0 15px;
    text-align:center;
    color:#ff9000;
}

.help p{
    font-size:16px;
    line-height:1.6;
}

#toast{
    position:absolute;
    left:50%;
    bottom:60px;
    transform:translateX(-50%);
    z-index:150;
    max-width:90%;
    padding:8px 15px;
    background:#222;
    border:1px solid #777;
    color:#fff;
    font-size:15px;
    text-align:center;
    display:none;
    border-radius:3px;
}
</style>
</head>

<body>

<div id="phone">

    <div id="header">MusicDJ</div>

    <div id="content"></div>

    <div id="softkeys">
        <span id="leftSoft">Select</span>
        <span id="rightSoft">Back</span>
    </div>

    <div id="toast"></div>
    <div id="dialogOverlay"></div>
    <div id="progressOverlay"></div>

</div>

<!-- MDJ IMPORT INPUT -->
<input
    type="file"
    id="mdjFileInput"
    accept=".mdj,application/json"
    style="display:none"
>

function formatTime(seconds){
    if(isNaN(seconds) || seconds < 0) seconds = 0;
    var m = Math.floor(seconds / 60);
    var s = Math.floor(seconds % 60);
    return (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
}

function getStepCount(){
    return (state.data && state.data[0]) ? state.data[0].length : INITIAL_STEPS;
}

function ensureStepCapacity(minSteps){
    for(var t = 0; t < TRACK_COUNT; t++){
        if(!state.data[t]) state.data[t] = [];
        while(state.data[t].length < minSteps){
            state.data[t].push(0);
        }
    }
}

function createEmptySong(stepCount){
    var steps = stepCount || INITIAL_STEPS;
    var data = [];
    for(var track = 0; track < TRACK_COUNT; track++){
        data[track] = [];
        for(var step = 0; step < steps; step++){
            data[track][step] = 0;
        }
    }
    return data;
}

function normalizeSongData(importedData){
    if(!Array.isArray(importedData)) return createEmptySong();

    var maxLen = INITIAL_STEPS;
    for(var t = 0; t < TRACK_COUNT; t++){
        if(Array.isArray(importedData[t]) && importedData[t].length > maxLen){
            maxLen = importedData[t].length;
        }
    }

    var newData = createEmptySong(maxLen);

    for(var track = 0; track < TRACK_COUNT; track++){
        if(!Array.isArray(importedData[track])) continue;
        for(var step = 0; step < maxLen; step++){
            var val = Number(importedData[track][step]);
            if(isNaN(val) || val < 0 || val > MAX_SOUND_POINTS){
                val = 0;
            }
            newData[track][step] = Math.floor(val);
        }
    }
    return newData;
}

function getLastOccupiedStep(){
    var last = -1;
    var totalSteps = getStepCount();
    for(var t = 0; t < TRACK_COUNT; t++){
        for(var s = 0; s < totalSteps; s++){
            if(state.data[t][s] > 0){
                if(s > last){
                    last = s;
                }
            }
        }
    }
    return last;
}

/* ============================================
   WEB AUDIO & FULL BACKGROUND PRELOADER
============================================ */

var audioCtx = null;
var audioBufferCache = {};
var activePlayingSources = [];
var currentPreviewSource = null;
var playerAudio = null;

function getAudioContext(){
    if(!audioCtx){
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
    }
    if(audioCtx.state === "suspended"){
        audioCtx.resume();
    }
    return audioCtx;
}

function loadSoundBuffer(trackIndex, pointNumber){
    if(!pointNumber || pointNumber <= 0 || pointNumber > MAX_SOUND_POINTS){
        return Promise.resolve(null);
    }

    var key = trackIndex + "_" + pointNumber;
    if(audioBufferCache[key]){
        return Promise.resolve(audioBufferCache[key]);
    }

    var primaryPath = "data/" + trackIndex + "/" + pointNumber + ".ogg";
    var fallbackPath = "data/" + trackIndex + "/" + pointNumber + ".mp3";

    return fetch(primaryPath)
        .then(function(res){
            if(!res.ok) throw new Error("OGG failed");
            return res.arrayBuffer();
        })
        .catch(function(){
            return fetch(fallbackPath).then(function(res){
                if(!res.ok) throw new Error("MP3 failed");
                return res.arrayBuffer();
            });
        })
        .then(function(arrayBuffer){
            var ctx = getAudioContext();
            return new Promise(function(resolve, reject){
                ctx.decodeAudioData(arrayBuffer, function(decodedData){
                    audioBufferCache[key] = decodedData;
                    resolve(decodedData);
                }, function(err){
                    reject(err);
                });
            });
        })
        .catch(function(){
            return null;
        });
}

function preloadEntireSoundLibrary(onProgress, onComplete){
    var list = [];
    for(var t = 0; t < TRACK_COUNT; t++){
        for(var p = 1; p <= MAX_SOUND_POINTS; p++){
            list.push({ track: t, point: p });
        }
    }

    var total = list.length;
    var loaded = 0;
    var concurrency = 6;
    var index = 0;

    function next(){
        if(index >= total){
            if(loaded >= total && onComplete){
                onComplete();
            }
            return;
        }
        var item = list[index++];
        loadSoundBuffer(item.track, item.point).then(function(){
            loaded++;
            if(onProgress) onProgress(loaded, total);
            next();
        }).catch(function(){
            loaded++;
            if(onProgress) onProgress(loaded, total);
            next();
        });
    }

    for(var c = 0; c < concurrency; c++){
        next();
    }
}

function stopCurrentPreview(){
    if(currentPreviewSource){
        try{
            currentPreviewSource.stop(0);
            currentPreviewSource.disconnect();
        }catch(e){}
        currentPreviewSource = null;
    }
}

function previewPoint(trackIndex, pointNumber){
    stopCurrentPreview();
    if(!pointNumber || pointNumber <= 0 || pointNumber > MAX_SOUND_POINTS) return;

    var ctx = getAudioContext();
    loadSoundBuffer(trackIndex, pointNumber).then(function(buffer){
        if(buffer){
            var source = ctx.createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = (state.bpm || BASE_BPM) / BASE_BPM;
            source.connect(ctx.destination);
            source.start(0);
            currentPreviewSource = source;
        }
    });
}

function playTrackAudio(trackIndex, pointNumber){
    if(!pointNumber || pointNumber <= 0 || pointNumber > MAX_SOUND_POINTS) return;
    var ctx = getAudioContext();
    var key = trackIndex + "_" + pointNumber;
    var buffer = audioBufferCache[key];
    var rate = (state.bpm || BASE_BPM) / BASE_BPM;

    if(buffer && state.playing){
        var source = ctx.createBufferSource();
        source.buffer = buffer;
        source.playbackRate.value = rate;
        source.connect(ctx.destination);
        source.start(0);
        activePlayingSources.push(source);
    }else{
        loadSoundBuffer(trackIndex, pointNumber).then(function(buf){
            if(buf && state.playing){
                var src = ctx.createBufferSource();
                src.buffer = buf;
                src.playbackRate.value = rate;
                src.connect(ctx.destination);
                src.start(0);
                activePlayingSources.push(src);
            }
        });
    }
}

function stopAllActiveAudio(){
    stopCurrentPreview();
    for(var i = 0; i < activePlayingSources.length; i++){
        try{
            activePlayingSources[i].stop(0);
            activePlayingSources[i].disconnect();
        }catch(e){}
    }
    activePlayingSources = [];
}

/* ============================================
   PLAYBACK ENGINE
============================================ */

function startPlayback(){
    stopAllActiveAudio();
    getAudioContext();

    var lastStep = getLastOccupiedStep();
    if(lastStep === -1){
        showToast("Track is empty");
        return;
    }

    if(state.playing) return;

    state.playing = true;
    state.currentStep = 0;
    sequencerTick();
}

function stopPlayback(){
    state.playing = false;

    if(state.timer){
        clearTimeout(state.timer);
        state.timer = null;
    }

    stopAllActiveAudio();
    state.currentStep = 0;

    if(state.screen === "composer"){
        renderComposer();
        scrollToCursor();
    }
}

function sequencerTick(){
    if(!state.playing) return;

    var lastStep = getLastOccupiedStep();

    if(lastStep === -1 || state.currentStep > lastStep || state.currentStep >= getStepCount()){
        stopPlayback();
        return;
    }

    for(var track = 0; track < TRACK_COUNT; track++){
        var point = state.data[track][state.currentStep];
        if(point > 0){
            playTrackAudio(track, point);
        }
    }

    if(state.screen === "composer"){
        renderComposer();
        scrollToPlayback();
    }

    var measureInterval = (60000 / (state.bpm || BASE_BPM)) * 4;

    if(state.currentStep >= lastStep){
        state.timer = setTimeout(function(){
            stopPlayback();
        }, measureInterval);
        return;
    }

    state.currentStep++;
    state.timer = setTimeout(sequencerTick, measureInterval);
}

/* ============================================
   OFFLINE RENDER ENGINE
============================================ */

function renderFullSong(onSuccess, onError){
    var lastStep = getLastOccupiedStep();
    if(lastStep === -1){
        if(onError) onError("empty");
        return;
    }

    showProgressModal("Rendering", "Mastering track audio...", 40);

    var totalStepsToRender = lastStep + 1;
    var effectiveBpm = state.bpm || BASE_BPM;
    var stepDuration = (60 / effectiveBpm) * 4;
    var totalDuration = totalStepsToRender * stepDuration;
    var sampleRate = 44100;
    var rate = effectiveBpm / BASE_BPM;

    setTimeout(function(){
        try{
            var OfflineCtxClass = window.OfflineAudioContext || window.webkitOfflineAudioContext;
            var offlineCtx = new OfflineCtxClass(2, Math.ceil(sampleRate * totalDuration), sampleRate);

            for(var step = 0; step < totalStepsToRender; step++){
                var startTime = step * stepDuration;
                for(var track = 0; track < TRACK_COUNT; track++){
                    var point = state.data[track][step];
                    if(point > 0){
                        var key = track + "_" + point;
                        var buffer = audioBufferCache[key];
                        if(buffer){
                            var source = offlineCtx.createBufferSource();
                            source.buffer = buffer;
                            source.playbackRate.value = rate;
                            source.connect(offlineCtx.destination);
                            source.start(startTime);
                        }
                    }
                }
            }

            var renderResult = offlineCtx.startRendering();
            if(renderResult && typeof renderResult.then === "function"){
                renderResult.then(function(renderedBuffer){
                    hideProgressModal();
                    var wavBlob = bufferToWaveBlob(renderedBuffer);
                    onSuccess(wavBlob);
                }).catch(function(err){
                    hideProgressModal();
                    if(onError) onError(err);
                });
            }else{
                offlineCtx.oncomplete = function(e){
                    hideProgressModal();
                    var wavBlob = bufferToWaveBlob(e.renderedBuffer);
                    onSuccess(wavBlob);
                };
            }
        }catch(e){
            hideProgressModal();
            if(onError) onError(e);
        }
    }, 40);
}

function startRenderAndPlay(){
    stopPlayback();
    stopCurrentPreview();

    renderFullSong(function(wavBlob){
        if(state.playerAudioUrl){
            URL.revokeObjectURL(state.playerAudioUrl);
        }
        state.playerAudioBlob = wavBlob;
        state.playerAudioUrl = URL.createObjectURL(wavBlob);
        openPlayerScreen();
    }, function(err){
        if(err === "empty") showToast("Track is empty");
        else showToast("Render error!");
    });
}

function exportAudioFile(){
    renderFullSong(function(wavBlob){
        var url = URL.createObjectURL(wavBlob);
        var a = document.createElement("a");
        a.href = url;
        a.download = sanitizeFilename(state.songName) + ".wav";
        document.body.appendChild(a);
        a.click();

        setTimeout(function(){
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 100);

        showToast("Audio exported (.wav)!");
    }, function(err){
        if(err === "empty") showToast("Track is empty");
        else showToast("Audio export failed");
    });
}

/* ============================================
   WAV ENCODER (ES5)
============================================ */

function bufferToWaveBlob(abuffer){
    var numOfChan = abuffer.numberOfChannels;
    var length = abuffer.length * numOfChan * 2 + 44;
    var outBuffer = new ArrayBuffer(length);
    var view = new DataView(outBuffer);
    var channels = [];
    var offset = 0;
    var pos = 0;

    function setUint16(data){ view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data){ view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8); 
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt " chunk
    setUint32(16);         // length = 16
    setUint16(1);          // PCM
    setUint16(numOfChan);
    setUint32(abuffer.sampleRate);
    setUint32(abuffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for(var i = 0; i < abuffer.numberOfChannels; i++){
        channels.push(abuffer.getChannelData(i));
    }

    while(offset < abuffer.length){
        for(var c = 0; c < numOfChan; c++){
            var sample = Math.max(-1, Math.min(1, channels[c][offset]));
            sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767) | 0;
            view.setInt16(pos, sample, true);
            pos += 2;
        }
        offset++;
    }

    return new Blob([outBuffer], { type: "audio/wav" });
}

        localStorage.setItem("musicdj_saved_song", JSON.stringify(getSongObject()));
        showToast('"' + state.songName + '" saved');
    }catch(error){
        showToast("Save error");
    }
}

function loadLocalSong(){
    try{
        var raw = localStorage.getItem("musicdj_saved_song");
        if(!raw){
            showToast("No saved song");
            return false;
        }
        var song = JSON.parse(raw);
        applySongData(song);
        showToast('Loaded: "' + state.songName + '"');
        return true;
    }catch(error){
        showToast("Load error");
        return false;
    }
}

function applySongData(song){
    if(!song || !Array.isArray(song.data)) return false;

    state.data = normalizeSongData(song.data);
    state.format = Number(song.format) || 1;
    state.bpm = Number(song.bpm) || 80;

    if(state.bpm < 30) state.bpm = 30;
    if(state.bpm > 300) state.bpm = 300;
    if(song.name) state.songName = String(song.name);

    state.cursorTrack = 0;
    state.cursorStep = 0;
    state.currentStep = 0;

    return true;
}

/* ============================================
   SEAMLESS SCROLLING LOGIC
============================================ */

function scrollToCursor(){
    var scrollArea = document.getElementById("stepsScrollArea");
    var cursorEl = document.querySelector(".step.cursor");
    if(scrollArea && cursorEl){
        var cellLeft = cursorEl.offsetLeft;
        var cellWidth = cursorEl.offsetWidth;
        var viewLeft = scrollArea.scrollLeft;
        var viewWidth = scrollArea.clientWidth;

        if(cellLeft < viewLeft){
            scrollArea.scrollLeft = Math.max(0, cellLeft - 40);
        }else if(cellLeft + cellWidth > viewLeft + viewWidth){
            scrollArea.scrollLeft = (cellLeft + cellWidth) - viewWidth + 40;
        }
    }
}

function scrollToPlayback(){
    var scrollArea = document.getElementById("stepsScrollArea");
    var playingEl = document.querySelector(".step.playing");
    if(scrollArea && playingEl){
        var cellLeft = playingEl.offsetLeft;
        var cellWidth = playingEl.offsetWidth;
        var viewLeft = scrollArea.scrollLeft;
        var viewWidth = scrollArea.clientWidth;

        if(cellLeft < viewLeft || cellLeft + cellWidth > viewLeft + viewWidth){
            scrollArea.scrollLeft = cellLeft - (viewWidth / 2) + (cellWidth / 2);
        }
    }
}

/* ============================================
   COMPOSER
============================================ */

function renderComposer(){
    var currentInfo = TRACK_INFO[state.cursorTrack];
    setHeader(currentInfo.icon + " <span>" + currentInfo.name + "</span>");
    setSoftkeys("Options", "Back");

    var totalSteps = getStepCount();

    var html =
        '<div class="composer">' +
            '<div class="composer-info">' +
                '<span>' + escapeHTML(state.songName) + '</span>' +
                '<span>Step: ' + (state.cursorStep + 1) + '</span>' +
                '<span style="cursor:pointer;" onclick="openTempoDialog()">' + state.bpm + ' BPM</span>' +
            '</div>' +
            '<div id="sequencer">' +
                '<div class="track-labels-col">' +
                    '<div class="track-label step-num-corner">#</div>';

    for(var t = 0; t < TRACK_COUNT; t++){
        var isActive = (t === state.cursorTrack);
        html += '<div class="track-label ' + (isActive ? 'active-track' : '') + '" title="' + TRACK_INFO[t].name + '">' + TRACK_INFO[t].icon + '</div>';
    }

    html +=
        '</div>' +
        '<div class="steps-scroll-area" id="stepsScrollArea">' +
            '<div class="step-numbers-row">';

    for(var sNum = 0; sNum < totalSteps; sNum++){
        var isCursorStep = (sNum === state.cursorStep);
        var isPlayingStep = (state.playing && sNum === state.currentStep);
        var numClass = "step-header-num";
        if(isCursorStep) numClass += " cursor";
        if(isPlayingStep) numClass += " playing";

        html += '<div class="' + numClass + '" onclick="setColumnCursor(' + sNum + ')">' + (sNum + 1) + '</div>';
    }

    html += '</div>';

    for(var track = 0; track < TRACK_COUNT; track++){
        html += '<div class="track-steps-row">';

        for(var step = 0; step < totalSteps; step++){
            var value = state.data[track][step] || 0;
            var className = "step";

            if(value > 0){
                className += " has-value";
            }
            if(track === state.cursorTrack && step === state.cursorStep){
                className += " cursor";
            }
            if(state.playing && step === state.currentStep){
                className += " playing";
            }

            html += '<div class="' + className + '" onclick="setComposerCursor(' + track + ',' + step + ')">' +
                (value > 0 ? value : "") +
            '</div>';
        }

        html += '</div>';
    }

    html +=
                '</div>' +
            '</div>' +
            '<div class="transport">' +
                '<button type="button" title="Play (1)" onclick="startPlayback()">' + ICONS.play + '</button>' +
                '<button type="button" title="Stop (#)" onclick="stopPlayback()">' + ICONS.stop + '</button>' +
                '<button type="button" title="BPM - (3)" onclick="changeBpm(-5)">' + ICONS.minus + '</button>' +
                '<button type="button" title="BPM + (9)" onclick="changeBpm(5)">' + ICONS.plus + '</button>' +
            '</div>' +
        '</div>';

    content.innerHTML = html;
}

function setColumnCursor(step){
    state.cursorStep = step;
    renderComposer();

}

/* ============================================
   NAVIGATION
============================================ */

function getMenuLength(){
    if(state.screen === "main") return MAIN_MENU.length;
    if(state.screen === "options") return OPTIONS_MENU.length;
    if(state.screen === "templates") return TEMPLATES.length;
    return 1;
}

function handleUp(){
    if(state.screen === "composer"){
        state.cursorTrack--;
        if(state.cursorTrack < 0) state.cursorTrack = TRACK_COUNT - 1;
        renderComposer();
        scrollToCursor();
        return;
    }

    if(state.screen === "pointList"){
        state.pointIndex--;
        if(state.pointIndex < 0) state.pointIndex = MAX_SOUND_POINTS;
        renderPointList();
        if(state.pointIndex > 0) previewPoint(state.cursorTrack, state.pointIndex);
        else stopCurrentPreview();
        return;
    }

    if(state.screen === "templates"){
        state.templateIndex--;
        if(state.templateIndex < 0) state.templateIndex = TEMPLATES.length - 1;
        renderTemplates();
        return;
    }

    state.menuIndex--;
    if(state.menuIndex < 0) state.menuIndex = getMenuLength() - 1;
    render();
}

function handleDown(){
    if(state.screen === "composer"){
        state.cursorTrack++;
        if(state.cursorTrack >= TRACK_COUNT) state.cursorTrack = 0;
        renderComposer();
        scrollToCursor();
        return;
    }

    if(state.screen === "pointList"){
        state.pointIndex++;
        if(state.pointIndex > MAX_SOUND_POINTS) state.pointIndex = 0;
        renderPointList();
        if(state.pointIndex > 0) previewPoint(state.cursorTrack, state.pointIndex);
        else stopCurrentPreview();
        return;
    }

    if(state.screen === "templates"){
        state.templateIndex++;
        if(state.templateIndex >= TEMPLATES.length) state.templateIndex = 0;
        renderTemplates();
        return;
    }

    state.menuIndex++;
    if(state.menuIndex >= getMenuLength()) state.menuIndex = 0;
    render();
}

function handleLeft(){
    if(state.screen === "composer"){
        if(state.cursorStep > 0){
            state.cursorStep--;
            renderComposer();
            scrollToCursor();
        }
    }else if(state.screen === "player" && playerAudio){
        playerAudio.currentTime = Math.max(0, playerAudio.currentTime - 3);
        updatePlayerUIProgress();
    }
}

function handleRight(){
    if(state.screen === "composer"){
        state.cursorStep++;
        if(state.cursorStep >= getStepCount()){
            ensureStepCapacity(state.cursorStep + 4);
        }
        renderComposer();
        scrollToCursor();
    }else if(state.screen === "player" && playerAudio){
        playerAudio.currentTime = Math.min(playerAudio.duration || 0, playerAudio.currentTime + 3);
        updatePlayerUIProgress();
    }
}

/* ============================================
   SELECT
============================================ */

function handleSelect(){
    if(state.screen === "main"){
        handleMainMenuSelect();
        return;
    }
    if(state.screen === "templates"){
        applySelectedTemplate();
        return;
    }
    if(state.screen === "composer"){
        openPointList();
        return;
    }
    if(state.screen === "pointList"){
        selectPoint();
        return;
    }
    if(state.screen === "options"){
        handleOptionSelect();
        return;
    }
    if(state.screen === "songInfo"){
        saveSongInfo();
        return;
    }
    if(state.screen === "player"){
        togglePlayerPlay();
        return;
    }
}

function handleMainMenuSelect(){
    if(state.menuIndex === 0){
        stopPlayback();
        stopCurrentPreview();
        state.data = createEmptySong(INITIAL_STEPS);
        state.bpm = 80;
        state.songName = "My song";
        state.cursorTrack = 0;
        state.cursorStep = 0;
        state.screen = "composer";
        render();
    }else if(state.menuIndex === 1){
        var loaded = loadLocalSong();
        if(loaded){
            state.screen = "composer";
            render();
        }
    }else if(state.menuIndex === 2){
        openTemplatesScreen("main");
    }else if(state.menuIndex === 3){
        openMDJFilePicker();
    }else if(state.menuIndex === 4){
        state.screen = "help";
        render();
    }
}

function openPointList(){
    stopPlayback();
    stopCurrentPreview();
    ensureStepCapacity(state.cursorStep + 1);
    state.pointIndex = state.data[state.cursorTrack][state.cursorStep] || 0;
    state.screen = "pointList";
    render();
    if(state.pointIndex > 0){
        previewPoint(state.cursorTrack, state.pointIndex);
    }
}

function selectPoint(){
    var selectedPoint = state.pointIndex;
    ensureStepCapacity(state.cursorStep + 1);
    state.data[state.cursorTrack][state.cursorStep] = selectedPoint;

    if(selectedPoint > 0){
        previewPoint(state.cursorTrack, selectedPoint);
    } else {
        stopCurrentPreview();
    }

    state.screen = "composer";
    render();
    scrollToCursor();
}

function handleOptionSelect(){
    if(state.menuIndex === 0) startRenderAndPlay();
    else if(state.menuIndex === 1) saveLocalSong();
    else if(state.menuIndex === 2) openTemplatesScreen("options");
    else if(state.menuIndex === 3) exportAudioFile();
    else if(state.menuIndex === 4) exportMDJ();
    else if(state.menuIndex === 5) openMDJFilePicker();
    else if(state.menuIndex === 6){
        state.screen = "songInfo";
        render();
    }
    else if(state.menuIndex === 7) clearCurrentTrack();
    else if(state.menuIndex === 8) clearSong();
    else if(state.menuIndex === 9) openTempoDialog();
}

function clearCurrentTrack(){
    var len = getStepCount();
    for(var step = 0; step < len; step++){
        state.data[state.cursorTrack][step] = 0;
    }
    state.screen = "composer";
    render();
    showToast("Track cleared");
}

function clearSong(){
    state.data = createEmptySong(INITIAL_STEPS);
    state.cursorTrack = 0;
    state.cursorStep = 0;
    state.screen = "composer";
    render();
    showToast("Song cleared");
}

function changeBpm(amount){
    state.bpm += amount;
    if(state.bpm < 30) state.bpm = 30;
    if(state.bpm > 300) state.bpm = 300;

    showToast("Tempo: " + state.bpm + " BPM");

    if(state.screen === "composer"){
        renderComposer();
    }else if(state.screen === "options"){
        render();
    }
}

function saveSongInfo(){
    var input = document.getElementById("songNameInput");
    if(input && input.value.trim()){
        state.songName = input.value.trim();
    }
    state.screen = "composer";
    render();
    showToast("Name updated");
}

/* ============================================
   MDJ EXPORT / IMPORT
============================================ */

function exportMDJ(){
    var mdjData = {
        data: state.data,
        format: state.format,
        bpm: state.bpm,
        name: state.songName
    };

    var json = JSON.stringify(mdjData);
    var blob = new Blob([json], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");

    link.href = url;
    link.download = sanitizeFilename(state.songName) + ".mdj";
    document.body.appendChild(link);
    link.click();

    setTimeout(function(){
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }, 100);

    showToast("MDJ exported");
}

function openMDJFilePicker(){
    mdjFileInput.value = "";
    mdjFileInput.click();
}

mdjFileInput.onchange = function(){
    var file = this.files[0];
    if(!file) return;
    importMDJFile(file);
};

function importMDJFile(file){
    var reader = new FileReader();
    reader.onload = function(event){
        try{
            var song = JSON.parse(event.target.result);
            var success = applySongData(song);
            if(!success) throw new Error("Invalid MDJ");

            state.screen = "composer";
            render();
            showToast(".mdj imported");
        }catch(error){
            showDialog("Import error", "Invalid or unsupported .mdj file");
        }
    };
    reader.onerror = function(){
        showDialog("Import error", "Could not read file");
    };
    reader.readAsText(file);
}

   DIALOG
============================================ */

function showDialog(title, message){
    closeDialog();
    dialogOverlay.style.display = "flex";
    dialogOverlay.innerHTML =
        '<div class="dialog">' +
            '<div class="dialog-title">' + escapeHTML(title) + '</div>' +
            '<div class="dialog-message">' + escapeHTML(message) + '</div>' +
            '<button class="dialog-button" onclick="closeDialog()">OK</button>' +
        '</div>';
}

function closeDialog(){
    dialogOverlay.style.display = "none";
    dialogOverlay.innerHTML = "";
}

/* ============================================
   BACK
============================================ */

function goBack(){
    stopCurrentPreview();

    if(dialogOverlay.style.display === "flex"){
        closeDialog();
        return;
    }

    if(state.screen === "composer"){
        stopPlayback();
        state.screen = "main";
        state.menuIndex = 0;
    }else if(state.screen === "pointList"){
        state.screen = "composer";
    }else if(state.screen === "templates"){
        state.screen = state.templateCaller || "main";
    }else if(state.screen === "options"){
        state.screen = "composer";
    }else if(state.screen === "songInfo"){
        state.screen = "composer";
    }else if(state.screen === "help"){
        state.screen = "main";
    }else if(state.screen === "player"){
        if(playerAudio){
            playerAudio.pause();
            playerAudio = null;
        }
        state.screen = "composer";
    }
    render();
}

/* ============================================
   KEYBOARD / KEYPAD
============================================ */

document.addEventListener("keydown", function(event){
    var activeTag = (document.activeElement && document.activeElement.tagName) ? document.activeElement.tagName.toUpperCase() : "";
    
    if(activeTag === "INPUT" || activeTag === "TEXTAREA"){
        if(event.key === "Enter"){
            saveSongInfo();
            event.preventDefault();
        }else if(event.key === "Escape"){
            goBack();
            event.preventDefault();
        }
        return;
    }

    var key = event.key;

    if(dialogOverlay.style.display === "flex"){
        if(key === "Enter" || key === "5" || key === "Escape" || key === "Backspace"){
            closeDialog();
            render();
        }else if(key === "ArrowLeft" || key === "4" || key === "3"){
            adjustTempoInDialog(-5);
        }else if(key === "ArrowRight" || key === "6" || key === "9"){
            adjustTempoInDialog(5);
        }
        event.preventDefault();
        return;
    }

    if(key === "ArrowUp" || key === "2"){
        handleUp();
    }else if(key === "ArrowDown" || key === "8"){
        handleDown();
    }else if(key === "ArrowLeft" || key === "4"){
        handleLeft();
    }else if(key === "ArrowRight" || key === "6"){
        handleRight();
    }else if(key === "Enter" || key === "5"){
        handleSelect();
    }else if(key === "1"){
        if(state.screen === "player"){
            togglePlayerPlay();
        }else{
            if(state.playing){
                stopPlayback();
            }else{
                startPlayback();
            }
        }
    }else if(key === "3"){
        if(state.screen !== "player") changeBpm(-5);
    }else if(key === "9"){
        if(state.screen !== "player") changeBpm(5);
    }else if(key === "*"){
        if(state.screen === "composer"){
            state.screen = "options";
            state.menuIndex = 0;
            render();
        }else if(state.screen === "player"){
            downloadRenderedAudio();
        }
    }else if(key === "#"){
        if(state.screen === "player"){
            stopPlayerAudio();
        }else{
            stopPlayback();
        }
    }else if(key === "Escape" || key === "Backspace"){
        goBack();
    }else{
        return;
    }

    event.preventDefault();
});

/* ============================================
   TOUCH / SOFTKEY SUPPORT
============================================ */

leftSoft.onclick = function(){
    if(state.screen === "composer"){
        state.screen = "options";
        state.menuIndex = 0;
        render();
    }else if(state.screen === "songInfo"){
        saveSongInfo();
    }else if(state.screen === "player"){
        downloadRenderedAudio();
    }else if(state.screen === "main" || state.screen === "pointList" || state.screen === "options" || state.screen === "templates"){
        handleSelect();
    }
};

rightSoft.onclick = function(){
    goBack();
};

/* ============================================
   HELPERS
============================================ */

function escapeHTML(text){
    return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function sanitizeFilename(name){
    return String(name || "musicdj").replace(/[\\\/:*?"<>|]/g, "_");
}

/* ============================================
   INITIALIZE & FULL BACKGROUND PRELOAD
============================================ */

render();

preloadEntireSoundLibrary(function(loaded, total){
    var pct = Math.round((loaded / total) * 100);
    var fill = document.getElementById("splashLoaderFill");
    var txt = document.getElementById("splashStatusText");
    if(fill) fill.style.width = pct + "%";
    if(txt) txt.innerText = "Loading (" + pct + "%)...";
}, function(){
    setTimeout(function(){
        state.screen = "main";
        state.menuIndex = 0;
        render();
    }, 400);
});

</script>
